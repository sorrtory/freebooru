# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: Run all project checks
    cmds:
      - task: check
  
  lint:
    desc: Run golangci-lint on the project
    cmds:
      - golangci-lint run

  format:
    desc: Format the code using golangci-lint
    cmds:
      - golangci-lint fmt

  fix:
    desc: Run golangci-lint with auto-fix enabled
    cmds:
      - golangci-lint run --fix
      - golangci-lint fmt
  
  test:
    desc: Run tests
    cmds:
      - go test -tags webkit2_41 ./...

  frontend:install:
    desc: Install locked frontend dependencies
    dir: frontend
    cmds:
      - npm ci --include=dev

  frontend:dev:
    desc: Run the Vue development server
    dir: frontend
    cmds:
      - npm run dev

  frontend:test:
    desc: Run frontend tests
    dir: frontend
    cmds:
      - npm test

  frontend:build:
    desc: Type-check and build the Vue application
    dir: frontend
    cmds:
      - npm run build

  server:dev:
    desc: Build the frontend and run the HTTP server
    deps: [frontend:build]
    cmds:
      - go run ./cmd/freebooru-server/

  server:build:
    desc: Build the HTTP server with embedded frontend assets
    deps: [frontend:build]
    cmds:
      - go build -o build/bin/freebooru-server ./cmd/freebooru-server/

  gui:dev:
    desc: Run the Wails desktop application on Linux
    dir: cmd/freebooru-gui
    env:
      FREEBOORU_API_TARGET: http://127.0.0.1:34115
    cmds:
      - go tool wails dev -devserver 127.0.0.1:34115 -tags webkit2_41

  gui:build:
    desc: Build the Wails desktop application on Linux
    deps: [frontend:build]
    dir: cmd/freebooru-gui
    cmds:
      - go tool wails build -s -tags webkit2_41

  gui:package:
    desc: Package the Linux amd64 Wails release artifact
    deps: [gui:build]
    cmds:
      - mkdir -p release-assets
      - tar -czf release-assets/freebooru-gui_Linux_x86_64.tar.gz -C cmd/freebooru-gui/build/bin freebooru-gui

  check:
    desc: Run code quality checks
    cmds:
      - task: frontend:test
      - task: frontend:build
      - task: format
      - task: lint
      - task: test

  release:
    desc: Run the complete MVP release gate
    cmds:
      - task: check
      - go test -race -tags webkit2_41 ./...
      - go test ./cmd/freebooru-cli -run '^TestMVPCleanHomeWorkflow$' -count=1
      - go mod verify

  release:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build portable release artifacts locally without publishing
    deps: [frontend:build]
    cmds:
      - goreleaser release --snapshot --clean --skip=nfpm

  cli:
    desc: Run the CLI application
    cmds:
      - go run ./cmd/freebooru-cli/
