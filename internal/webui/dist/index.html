    <title>FreeBooru</title>

    <link rel="stylesheet" crossorigin href="/assets/index-DmCma-oj.css">

  <body>
    <div id="app"></div>
    <script>
      (() => {
        const preference = localStorage.getItem('freebooru.theme') || 'system'
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </body>
