name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            archive_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            archive_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build embedded web application
        working-directory: frontend
        run: |
          npm ci --include=dev
          npm run build

      - name: Build native desktop application
        working-directory: cmd/freebooru-gui
        run: go tool wails build -s -platform linux/${{ matrix.arch }} -tags webkit2_41 -trimpath

      - name: Prepare desktop artifacts
        run: |
          mkdir -p release-assets
          cp cmd/freebooru-gui/build/bin/freebooru-gui release-assets/freebooru-gui_${{ matrix.arch }}
          tar -czf release-assets/freebooru-gui_Linux_${{ matrix.archive_arch }}.tar.gz \
            -C cmd/freebooru-gui/build/bin freebooru-gui

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freebooru-gui-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: freebooru-gui-*
          path: release-assets
          merge-multiple: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
