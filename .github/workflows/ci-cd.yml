name: CI/CD

on:
  push:
    branches: [ "dev" ]
  pull_request:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: freebooru

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: freebooru/pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          version: "latest"
          run_install: false

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            freebooru/src-tauri -> freebooru/src-tauri/target

      - name: Cargo fmt (check)
        run: cargo fmt --all --check
        working-directory: freebooru/src-tauri

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: freebooru/src-tauri

      - name: Cargo test
        run: cargo test --all --all-features
        working-directory: freebooru/src-tauri

  cd:
    runs-on: ubuntu-24.04
    needs: [ ci ]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload repo to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          rsync -az --delete \
            -e "ssh -p $SSH_PORT" \
            --exclude ".git" \
            --exclude "**/node_modules" \
            --exclude "**/dist" \
            --exclude "**/target" \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Deploy (docker compose up -d --build)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            cd $APP_DIR/deploy
            docker compose -f docker-compose.yml up -d --build
          "
